  <title>TaChi — Trung tâm quản trị</title>
  <style>
    :root{--navy:#183c50;--navy2:#22566a;--teal:#138982;--orange:#f07850;--ink:#29383e;--muted:#75848a;--line:#e6edef;--bg:#f3f6f7;--white:#fff;--shadow:0 2px 9px #1937460a}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.5 Arial,Helvetica,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}
    .top{height:58px;background:var(--navy);color:#fff;display:flex;align-items:center;padding:0 22px;gap:12px;position:sticky;top:0;z-index:5;box-shadow:0 2px 8px #102e3a18}.brand{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:bold}.brand-mark{width:31px;height:31px;border-radius:8px;background:linear-gradient(145deg,#35b0a5,#138982);display:grid;place-items:center}.brand small{font-weight:400;opacity:.72;border-left:1px solid #ffffff44;padding-left:12px;margin-left:4px}.admin-user{margin-left:auto;display:flex;align-items:center;gap:10px}.admin-avatar{width:31px;height:31px;border-radius:50%;display:grid;place-items:center;background:#d7e8eb;color:var(--navy)}.admin-user button{border:1px solid #ffffff44;background:#ffffff10;color:white;padding:7px 10px;border-radius:4px}
    .shell{max-width:1600px;margin:auto;display:grid;grid-template-columns:220px minmax(0,1fr);min-height:calc(100vh - 58px)}.sidebar{background:#fff;border-right:1px solid var(--line);padding:16px 10px}.side-label{color:#92a0a5;font-size:10px;text-transform:uppercase;letter-spacing:.8px;font-weight:bold;padding:10px 11px 6px}.nav-btn{width:100%;border:0;background:none;color:#5a6a70;text-align:left;padding:10px 11px;border-radius:5px;margin:2px 0}.nav-btn:hover,.nav-btn.active{background:#eaf3f5;color:var(--navy2);font-weight:bold}.nav-btn .icon{display:inline-block;width:25px;color:#7a929b}.divider{height:1px;background:var(--line);margin:8px 7px}
    main{min-width:0;padding:19px 20px 34px}.topline{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.topline h1{font-size:21px;margin:0}.topline p{margin:3px 0 0;color:var(--muted);font-size:11px}.demo{border-radius:4px;background:#fff3dc;border:1px solid #f1d8a1;color:#765c27;padding:9px 12px;margin-bottom:14px}.warning{background:#fff0eb;border:1px solid #f4c3b4;color:#98543c}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}.stat,.card{background:#fff;border:1px solid #e9eff0;border-radius:7px;box-shadow:var(--shadow)}.stat{padding:14px}.stat .label{color:#718087;font-size:11px}.stat strong{display:block;font-size:23px;margin:7px 0 2px;color:var(--navy2)}.stat small{color:#79928e}.card{padding:15px}.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.card-head h2{font-size:15px;margin:0}.quiet{color:var(--muted);font-size:11px}.button{border:0;background:var(--teal);color:white;padding:9px 13px;border-radius:4px}.button:hover{background:#0d746e}.button.light{background:#fff;border:1px solid #cbd9dc;color:var(--navy2)}.button.danger{background:#b94d48}.button.small{font-size:11px;padding:6px 9px}
    .filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}.filters input,.filters select{padding:9px 10px;border:1px solid #dce5e7;border-radius:4px;background:#fff}.filters input{flex:1;min-width:190px}.tabs{display:flex;gap:5px;flex-wrap:wrap}.tab{border:1px solid #e1e8e9;background:#fff;padding:7px 10px;border-radius:4px;color:#66777d}.tab.active{border-color:#7bb7b4;background:#eaf6f5;color:#147d78;font-weight:bold}
    .case-layout{display:grid;grid-template-columns:minmax(265px,335px) minmax(0,1fr);gap:12px;align-items:start}.case-list{padding:0;overflow:hidden}.list-head{padding:13px 14px;border-bottom:1px solid var(--line);font-weight:bold;display:flex;justify-content:space-between}.case-items{max-height:calc(100vh - 330px);min-height:380px;overflow:auto}.case-item{padding:13px 14px;border-bottom:1px solid #edf1f2;cursor:pointer;border-left:3px solid transparent}.case-item:hover{background:#f8fbfb}.case-item.active{background:#eff7f7;border-left-color:var(--teal)}.case-item h3{margin:0 0 5px;font-size:12px}.case-meta{font-size:10px;color:#829096;display:flex;justify-content:space-between;gap:5px}.case-item p{margin:7px 0 0;font-size:11px;color:#65747a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.badge{display:inline-block;padding:3px 7px;border-radius:15px;font-size:10px;background:#f0f3f4;color:#67757a;white-space:nowrap}.badge.new{background:#fff0df;color:#a96a23}.badge.review{background:#eaf2ff;color:#456eab}.badge.wait{background:#f3ebff;color:#7653a6}.badge.done{background:#e6f5ee;color:#2a8062}.badge.high{background:#ffebe8;color:#b24c40}
    .detail{padding:0;overflow:hidden}.detail-head{padding:15px 17px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.detail-head h2{margin:0;font-size:16px}.detail-head p{margin:4px 0 0;color:var(--muted);font-size:11px}.detail-body{padding:16px}.case-facts{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:13px}.fact{background:#f7f9fa;border-radius:5px;padding:9px 10px}.fact span{display:block;font-size:10px;color:#839095;margin-bottom:3px}.fact strong{font-size:11px;word-break:break-word}.issue{border:1px solid #e7edef;border-radius:5px;padding:12px;margin-bottom:13px}.issue h3{font-size:12px;margin:0 0 6px}.issue p{margin:0;white-space:pre-wrap;color:#596970;line-height:1.55}.timeline{border-left:2px solid #d8e7e7;margin:12px 0 17px 5px;padding-left:14px}.event{position:relative;padding:0 0 14px}.event:before{content:"";position:absolute;left:-20px;top:5px;width:8px;height:8px;border-radius:50%;background:#48a59e;border:2px solid white;box-shadow:0 0 0 1px #48a59e}.event b{font-size:11px}.event small{display:block;color:#8a989c;font-size:10px}.event p{font-size:11px;color:#596970;margin:3px 0 0;white-space:pre-wrap}.resolution{border-top:1px solid var(--line);padding-top:14px}.resolution h3{margin:0 0 10px;font-size:13px}.resolution-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{display:block;color:#6b7b80;font-size:10px;margin-bottom:4px}.field select,.field textarea,.field input{width:100%;border:1px solid #dce5e7;border-radius:4px;padding:9px;background:#fff}.field textarea{min-height:74px;resize:vertical}.field.full{grid-column:1/-1}.checkline{font-size:11px;color:#64747a;display:flex;align-items:center;gap:6px;margin:9px 0}.detail-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}.empty{text-align:center;padding:35px;color:#879397}
    .table-wrap{overflow:auto}.data-table{width:100%;border-collapse:collapse;min-width:620px}.data-table th,.data-table td{text-align:left;padding:11px 9px;border-bottom:1px solid var(--line);font-size:11px}.data-table th{background:#f7f9fa;color:#77868b;font-weight:600}.data-table button{border:0;background:none;color:#267e80}
    .overview-grid{display:grid;grid-template-columns:1.2fr 1fr;gap:12px}.quick-link{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:11px 2px}.quick-link:last-child{border:0}.quick-link button{border:0;background:#eaf6f5;color:#177d78;padding:6px 9px;border-radius:4px}.bar-chart{height:185px;display:flex;align-items:end;justify-content:space-around;padding:12px 10px 20px;background:repeating-linear-gradient(to bottom,#fff 0,#fff 43px,#edf1f2 44px);margin-top:8px}.bar{width:7%;background:linear-gradient(#69bcb5,#187c82);border-radius:4px 4px 0 0;position:relative}.bar:after{content:attr(data-day);position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);font-size:9px;color:#849196}
    .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#243d48;color:white;padding:10px 15px;border-radius:5px;z-index:10;box-shadow:0 5px 16px #0002;display:none}
    @media(max-width:1050px){.shell{grid-template-columns:190px minmax(0,1fr)}main{padding:15px}.case-layout{grid-template-columns:280px minmax(0,1fr)}.case-facts{grid-template-columns:1fr 1fr}.stats{gap:8px}.stat{padding:11px}}
    @media(max-width:760px){.shell{grid-template-columns:1fr}.sidebar{display:flex;overflow:auto;padding:6px 8px;border-right:0;border-bottom:1px solid var(--line)}.side-label,.divider{display:none}.nav-btn{white-space:nowrap;width:auto;padding:8px}.nav-btn .icon{display:none}.case-layout{grid-template-columns:1fr}.case-items{max-height:280px;min-height:0}.case-list{order:0}.detail{order:1}.stats{grid-template-columns:repeat(2,1fr)}.overview-grid{grid-template-columns:1fr}}
    @media(max-width:500px){main{padding:11px}.top{padding:0 12px}.brand{font-size:14px}.brand small{font-size:10px}.admin-user span:not(.admin-avatar){display:none}.topline{align-items:flex-start;gap:8px;flex-direction:column}.case-facts,.resolution-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.detail-head{flex-direction:column}.detail-actions{justify-content:stretch}.detail-actions button{flex:1}.stats strong{font-size:20px}}
  </style>
  <style>

<body>
  <header class="top"><a class="brand" href="./index.html"><span class="brand-mark">TC</span>TaChi <small>TRUNG TÂM QUẢN TRỊ</small></a><div class="admin-user"><span>Quản trị viên</span><span class="admin-avatar">AD</span><button onclick="notify('Đây là tài khoản quản trị demo')">Tài khoản demo</button></div></header>
  <div class="shell">
    <aside class="sidebar">
      <div class="side-label">Tổng quan</div><button class="nav-btn" data-view="overview"><span class="icon">⌂</span>Bảng điều khiển</button>
      <div class="divider"></div><div class="side-label">Vận hành & hỗ trợ</div>
      <button class="nav-btn active" data-view="complaints"><span class="icon">⚑</span>Khiếu nại & tranh chấp <span id="navOpenCount"></span></button>
      <button class="nav-btn" data-view="sellers"><span class="icon">▣</span>Quản lý người bán</button>
      <button class="nav-btn" data-view="customers"><span class="icon">♙</span>Khách hàng</button>
    </aside>
    <main>
      <div class="topline"><div><h1 id="pageTitle">Khiếu nại & tranh chấp</h1><p id="pageDescription">Tiếp nhận, xác minh và xử lý phản ánh giữa khách hàng và người bán.</p></div><button class="button light" onclick="notify('Đã làm mới danh sách')">↻ Làm mới</button></div>
      <div class="demo">⚠️ Bản demo quản trị: dữ liệu mẫu và dữ liệu phản ánh được gửi từ trang mua sắm. Chưa có đăng nhập phân quyền hoặc kết nối máy chủ.</div>
      <div id="storageNotice"></div>
      <div id="view"></div>
    </main>
  </div>
  <div class="toast" id="toast"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
  <script>
    const STORE_KEY="choviet_complaints_v1";
    const demoCases=[
      {id:"CV-KN-10428",category:"Sản phẩm / người bán",orderId:"CV-261118-042",customer:"Trần Minh Hà",contact:"ha.tran@example.com",seller:"Góc Nhà Xinh",status:"Đang xác minh",priority:"Cao",createdAt:"2026-11-19T08:42:00+07:00",message:"Khách phản ánh sản phẩm nhận được khác màu so với hình đăng bán. Đề nghị kiểm tra ảnh sản phẩm và trao đổi phương án đổi hàng hoặc hoàn tiền.",timeline:[{actor:"Khách hàng",text:"Gửi khiếu nại về sản phẩm không đúng mô tả.",at:"2026-11-19T08:42:00+07:00"},{actor:"TaChi · Hệ thống",text:"Đã ghi nhận khiếu nại và chuyển đội ngũ hỗ trợ xác minh.",at:"2026-11-19T08:46:00+07:00"}]},
      {id:"CV-KN-10426",category:"Đơn hàng và giao hàng",orderId:"CV-261117-038",customer:"Lê Quốc Bảo",contact:"0903 222 716",seller:"Thời Trang Mộc",status:"Chờ người bán",priority:"Thường",createdAt:"2026-11-19T07:15:00+07:00",message:"Đơn hàng đã quá ngày giao dự kiến nhưng chưa nhận được cập nhật. Khách muốn biết vị trí kiện hàng và thời gian giao mới.",timeline:[{actor:"Khách hàng",text:"Hỏi về tình trạng giao hàng bị trễ.",at:"2026-11-19T07:15:00+07:00"},{actor:"TaChi · Hỗ trợ",text:"Đã yêu cầu người bán kiểm tra với đơn vị vận chuyển.",at:"2026-11-19T07:30:00+07:00"}]},
      {id:"CV-KN-10421",category:"Thanh toán và hoàn tiền",orderId:"CV-261116-019",customer:"Phạm Thu Trang",contact:"trang.pham@example.com",seller:"Nhà Mây Official",status:"Mới tiếp nhận",priority:"Cao",createdAt:"2026-11-19T06:25:00+07:00",message:"Đơn hàng bị hủy nhưng khách chưa nhận được khoản hoàn tiền. Cần đối soát giao dịch và thông báo thời gian xử lý.",timeline:[{actor:"Khách hàng",text:"Yêu cầu kiểm tra khoản tiền hoàn sau khi đơn bị hủy.",at:"2026-11-19T06:25:00+07:00"}]},
      {id:"CV-KN-10408",category:"Sản phẩm / người bán",orderId:"CV-261115-011",customer:"Nguyễn Gia Linh",contact:"linh.nguyen@example.com",seller:"Bếp Xanh",status:"Đã xử lý",priority:"Thường",createdAt:"2026-11-18T16:05:00+07:00",message:"Khách nhận thiếu phụ kiện trong hộp sản phẩm và yêu cầu người bán gửi bổ sung.",timeline:[{actor:"Khách hàng",text:"Báo thiếu phụ kiện.",at:"2026-11-18T16:05:00+07:00"},{actor:"Người bán",text:"Đồng ý gửi bổ sung phụ kiện miễn phí.",at:"2026-11-18T17:10:00+07:00"},{actor:"TaChi · Hỗ trợ",text:"Đã xác nhận phương án với khách hàng và đóng vụ việc.",at:"2026-11-18T17:30:00+07:00"}]}
    ];
    let complaints=[],selectedId="",statusFilter="Tất cả",searchText="",activeView="complaints",storageProblem="";
    const escapeHTML=value=>String(value??"").replace(/[&<>"']/g,char=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[char]));
    const formatDate=value=>{const date=new Date(value);return Number.isNaN(date.getTime())?"—":new Intl.DateTimeFormat("vi-VN",{dateStyle:"short",timeStyle:"short"}).format(date)};
    function loadComplaints(){try{const raw=localStorage.getItem(STORE_KEY);if(raw===null){complaints=demoCases.map(item=>({...item,timeline:item.timeline.map(event=>({...event}))}));saveComplaints(false)}else{const parsed=JSON.parse(raw);if(!Array.isArray(parsed))throw new Error("Dữ liệu khiếu nại không đúng định dạng");complaints=parsed}}catch(error){console.error("Không thể đọc danh sách khiếu nại:",error);storageProblem="Không truy cập được bộ nhớ trình duyệt. Thay đổi ở bản demo này có thể không được lưu.";complaints=demoCases.map(item=>({...item,timeline:item.timeline.map(event=>({...event}))}))}selectedId=complaints[0]?.id||""}
    function saveComplaints(showSuccess=true){try{localStorage.setItem(STORE_KEY,JSON.stringify(complaints));storageProblem="";if(showSuccess)notify("Đã lưu cập nhật vụ việc")}catch(error){console.error("Không thể lưu danh sách khiếu nại:",error);storageProblem="Không lưu được dữ liệu vào bộ nhớ trình duyệt. Vui lòng thử lại.";renderStorageNotice();if(showSuccess)notify("Lưu thất bại. Hãy thử lại.")}}
    function renderStorageNotice(){const el=document.getElementById("storageNotice");if(el)el.innerHTML=storageProblem?`<div class="demo warning">${escapeHTML(storageProblem)}</div>`:""}
    function notify(message){const el=document.getElementById("toast");el.textContent=message;el.style.display="block";clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.style.display="none",2600)}
    function openCount(){return complaints.filter(item=>item.status!=="Đã xử lý"&&item.status!=="Đã từ chối").length}
    function setView(view){activeView=view;document.querySelectorAll(".nav-btn").forEach(button=>button.classList.toggle("active",button.dataset.view===view));render()}
    function render(){renderStorageNotice();document.getElementById("navOpenCount").textContent=`(${openCount()})`;const titles={overview:["Bảng điều khiển","Tình hình vận hành và các việc cần ưu tiên."],complaints:["Khiếu nại & tranh chấp","Tiếp nhận, xác minh và xử lý phản ánh giữa khách hàng và người bán."],sellers:["Quản lý người bán","Theo dõi tình trạng hoạt động và hỗ trợ cửa hàng."],customers:["Khách hàng","Tra cứu khách hàng liên quan đến yêu cầu hỗ trợ."]};document.getElementById("pageTitle").textContent=titles[activeView][0];document.getElementById("pageDescription").textContent=titles[activeView][1];const root=document.getElementById("view");if(activeView==="complaints")root.innerHTML=complaintsView();else if(activeView==="overview")root.innerHTML=overviewView();else if(activeView==="sellers")root.innerHTML=sellersView();else if(activeView==="customers")root.innerHTML=customersView()}
    function badgeClass(status){return status==="Mới tiếp nhận"?"new":status==="Đang xác minh"?"review":status==="Chờ người bán"?"wait":status==="Đã xử lý"?"done":""}
    function filteredComplaints(){return complaints.filter(item=>(statusFilter==="Tất cả"||item.status===statusFilter)&&(!searchText||[item.id,item.orderId,item.customer,item.seller,item.category,item.message].join(" ").toLowerCase().includes(searchText.toLowerCase())))}
    function complaintsView(){const open=complaints.filter(item=>item.status!=="Đã xử lý"&&item.status!=="Đã từ chối").length;const list=filteredComplaints();if(!list.some(item=>item.id===selectedId))selectedId=list[0]?.id||"";return `<div class="stats"><section class="stat"><span class="label">Tổng khiếu nại</span><strong>${complaints.length}</strong><small>Toàn bộ yêu cầu tiếp nhận</small></section><section class="stat"><span class="label">Cần xử lý</span><strong>${open}</strong><small>Chưa đóng vụ việc</small></section><section class="stat"><span class="label">Ưu tiên cao</span><strong>${complaints.filter(item=>item.priority==="Cao"&&item.status!=="Đã xử lý").length}</strong><small>Đề nghị xem xét sớm</small></section><section class="stat"><span class="label">Đã xử lý</span><strong>${complaints.filter(item=>item.status==="Đã xử lý").length}</strong><small>Đã có kết quả</small></section></div><section class="card"><div class="filters"><input aria-label="Tìm khiếu nại" placeholder="Tìm mã vụ việc, đơn hàng, khách hoặc shop..." value="${escapeHTML(searchText)}" oninput="searchCases(this.value)"><select aria-label="Lọc trạng thái" onchange="filterCases(this.value)">${["Tất cả","Mới tiếp nhận","Đang xác minh","Chờ người bán","Đã xử lý","Đã từ chối"].map(status=>`<option ${statusFilter===status?"selected":""}>${status}</option>`).join("")}</select><button class="button light" onclick="clearFilters()">Xóa lọc</button></div><div class="case-layout"><section class="card case-list"><div class="list-head"><span>Danh sách vụ việc</span><span class="quiet">${list.length} kết quả</span></div><div class="case-items">${list.length?list.map(caseItem).join(""):'<div class="empty">Không tìm thấy khiếu nại phù hợp.</div>'}</div></section><section class="card detail">${selectedId?caseDetail(complaints.find(item=>item.id===selectedId)):'<div class="empty">Chọn vụ việc để xem chi tiết.</div>'}</section></div></section>`}
    function caseItem(item){return `<article class="case-item ${item.id===selectedId?"active":""}" onclick="selectCase('${escapeHTML(item.id)}')"><h3>${escapeHTML(item.category)}</h3><div class="case-meta"><span>${escapeHTML(item.id)}</span><span class="badge ${badgeClass(item.status)}">${escapeHTML(item.status)}</span></div><p>${escapeHTML(item.customer)} · ${escapeHTML(item.seller)}</p><p>${escapeHTML(item.message)}</p><div class="case-meta" style="margin-top:7px"><span>${formatDate(item.createdAt)}</span><span class="badge ${item.priority==="Cao"?"high":""}">${escapeHTML(item.priority)}</span></div></article>`}
    function caseDetail(item){if(!item)return '<div class="empty">Không tìm thấy vụ việc.</div>';const history=Array.isArray(item.timeline)?item.timeline:[];return `<div class="detail-head"><div><h2>${escapeHTML(item.category)}</h2><p>Mã vụ việc ${escapeHTML(item.id)} · Tiếp nhận ${formatDate(item.createdAt)}</p></div><span class="badge ${badgeClass(item.status)}">${escapeHTML(item.status)}</span></div><div class="detail-body"><div class="case-facts"><div class="fact"><span>Khách hàng</span><strong>${escapeHTML(item.customer)}</strong></div><div class="fact"><span>Liên hệ</span><strong>${escapeHTML(item.contact)}</strong></div><div class="fact"><span>Người bán</span><strong>${escapeHTML(item.seller)}</strong></div><div class="fact"><span>Mã đơn hàng</span><strong>${escapeHTML(item.orderId||"Chưa cung cấp")}</strong></div><div class="fact"><span>Mức độ ưu tiên</span><strong>${escapeHTML(item.priority||"Thường")}</strong></div><div class="fact"><span>Cập nhật gần nhất</span><strong>${formatDate(item.updatedAt||item.createdAt)}</strong></div></div><div class="issue"><h3>Nội dung khách hàng phản ánh</h3><p>${escapeHTML(item.message)}</p></div><h3 style="font-size:12px;margin:0">Lịch sử xử lý</h3><div class="timeline">${history.length?history.map(event=>`<div class="event"><b>${escapeHTML(event.actor)}</b><small>${formatDate(event.at)}</small><p>${escapeHTML(event.text)}</p></div>`).join(""):'<div class="quiet">Chưa có cập nhật.</div>'}</div><form class="resolution" onsubmit="updateCase(event,'${escapeHTML(item.id)}')"><h3>Cập nhật và phản hồi</h3><div class="resolution-grid"><div class="field"><label>Trạng thái xử lý</label><select name="status">${["Mới tiếp nhận","Đang xác minh","Chờ khách hàng","Chờ người bán","Đã xử lý","Đã từ chối"].map(status=>`<option ${item.status===status?"selected":""}>${status}</option>`).join("")}</select></div><div class="field"><label>Phản hồi đến</label><select name="recipient"><option>Khách hàng</option><option>Người bán</option><option>Nội bộ</option></select></div><div class="field full"><label>Nội dung cập nhật / hướng giải quyết</label><textarea name="response" placeholder="Ghi nội dung đã xác minh, yêu cầu bổ sung hoặc kết quả xử lý..."></textarea></div></div><label class="checkline"><input type="checkbox" name="internal"> Chỉ ghi chú nội bộ, không gửi cho khách hàng/người bán</label><div class="detail-actions"><button type="button" class="button light" onclick="selectCase('${escapeHTML(item.id)}')">Hủy</button><button class="button">Lưu cập nhật</button></div></form></div>`}
    function selectCase(id){selectedId=id;render()}
    function searchCases(value){searchText=value;render()}
    function filterCases(value){statusFilter=value;render()}
    function clearFilters(){statusFilter="Tất cả";searchText="";render()}
    function updateCase(event,id){event.preventDefault();const item=complaints.find(entry=>entry.id===id);if(!item)return;const data=new FormData(event.currentTarget);const newStatus=String(data.get("status"));const response=String(data.get("response")||"").trim();const internal=data.has("internal");if(!response&&item.status===newStatus){notify("Hãy nhập nội dung cập nhật hoặc thay đổi trạng thái.");return}item.status=newStatus;item.updatedAt=new Date().toISOString();if(!Array.isArray(item.timeline))item.timeline=[];item.timeline.push({actor:internal?"Ghi chú nội bộ":`TaChi · ${String(data.get("recipient"))}`,text:response||`Cập nhật trạng thái vụ việc: ${newStatus}.`,at:item.updatedAt});selectedId=id;saveComplaints();render()}
    function overviewView(){const open=openCount();return `<div class="stats"><section class="stat"><span class="label">Vụ việc đang mở</span><strong>${open}</strong><small>Đang chờ xử lý</small></section><section class="stat"><span class="label">Khiếu nại mới</span><strong>${complaints.filter(item=>item.status==="Mới tiếp nhận").length}</strong><small>Cần phân loại</small></section><section class="stat"><span class="label">Người bán hoạt động</span><strong>1.284</strong><small>Trên TaChi</small></section><section class="stat"><span class="label">Yêu cầu ưu tiên cao</span><strong>${complaints.filter(item=>item.priority==="Cao"&&item.status!=="Đã xử lý").length}</strong><small>Kiểm tra sớm</small></section></div><div class="overview-grid"><section class="card"><div class="card-head"><h2>Việc cần ưu tiên</h2><span class="quiet">${open} vụ đang mở</span></div>${complaints.filter(item=>item.status!=="Đã xử lý"&&item.status!=="Đã từ chối").slice(0,4).map(item=>`<div class="quick-link"><span><b>${escapeHTML(item.id)}</b> · ${escapeHTML(item.category)}<br><small class="quiet">${escapeHTML(item.customer)} ↔ ${escapeHTML(item.seller)}</small></span><button onclick="selectedId='${escapeHTML(item.id)}';setView('complaints')">Xử lý</button></div>`).join("")||'<p class="quiet">Không có vụ việc đang mở.</p>'}</section><section class="card"><div class="card-head"><h2>Tiếp nhận 7 ngày qua</h2><span class="quiet">Tổng hợp demo</span></div><div class="bar-chart">${[33,48,42,70,55,88,64].map((height,index)=>`<div class="bar" data-day="${["T5","T6","T7","CN","T2","T3","T4"][index]}" style="height:${height}%"></div>`).join("")}</div></section></div><section class="card" style="margin-top:12px"><div class="card-head"><h2>Nguyên tắc xử lý</h2></div><p class="quiet">Ghi nhận đầy đủ bằng chứng · Lắng nghe cả khách hàng và người bán · Không chia sẻ thông tin cá nhân ngoài phạm vi xử lý · Cập nhật trạng thái minh bạch cho các bên.</p></section>`}
    const sellers=[{name:"Góc Nhà Xinh",orders:328,status:"Đang hoạt động",rate:"4,8/5"},{name:"Thời Trang Mộc",orders:214,status:"Đang hoạt động",rate:"4,6/5"},{name:"Nhà Mây Official",orders:486,status:"Cần theo dõi",rate:"4,2/5"},{name:"Bếp Xanh",orders:167,status:"Đang hoạt động",rate:"4,9/5"}];
    function sellersView(){return `<section class="card"><div class="card-head"><h2>Danh sách người bán</h2><input placeholder="Tìm tên shop..." oninput="filterSellerRows(this.value)"></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Tên cửa hàng</th><th>Đơn hàng</th><th>Đánh giá</th><th>Tình trạng</th><th>Khiếu nại đang mở</th></tr></thead><tbody id="sellerRows">${sellerRows(sellers)}</tbody></table></div></section>`}
    function sellerRows(list){return list.map(seller=>`<tr><td>${escapeHTML(seller.name)}</td><td>${seller.orders}</td><td>${escapeHTML(seller.rate)}</td><td><span class="badge ${seller.status==="Đang hoạt động"?"done":"new"}">${escapeHTML(seller.status)}</span></td><td>${complaints.filter(item=>item.seller===seller.name&&item.status!=="Đã xử lý").length}</td></tr>`).join("")||'<tr><td colspan="5">Không tìm thấy cửa hàng.</td></tr>'}
    function filterSellerRows(query){document.getElementById("sellerRows").innerHTML=sellerRows(sellers.filter(seller=>seller.name.toLowerCase().includes(query.toLowerCase())))}
    function customersView(){const customers=new Map();complaints.forEach(item=>{const entry=customers.get(item.customer)||{contact:item.contact,count:0,open:0};entry.count++;if(item.status!=="Đã xử lý"&&item.status!=="Đã từ chối")entry.open++;customers.set(item.customer,entry)});return `<section class="card"><div class="card-head"><h2>Khách hàng đã gửi phản ánh</h2><span class="quiet">${customers.size} khách hàng</span></div><div class="table-wrap"><table class="data-table"><thead><tr><th>Khách hàng</th><th>Thông tin liên hệ</th><th>Số vụ việc</th><th>Đang mở</th><th>Thao tác</th></tr></thead><tbody>${Array.from(customers.entries()).map(([name,value])=>`<tr><td>${escapeHTML(name)}</td><td>${escapeHTML(value.contact)}</td><td>${value.count}</td><td>${value.open}</td><td><button onclick="setView('complaints')">Mở khiếu nại</button></td></tr>`).join("")||'<tr><td colspan="5">Chưa có khách hàng gửi phản ánh.</td></tr>'}</tbody></table></div></section>`}
    document.querySelectorAll(".nav-btn").forEach(button=>button.addEventListener("click",()=>setView(button.dataset.view)));
    async function syncComplaintsFromCloud() {
    if (typeof supabaseClient === "undefined") return;
    const { data, error } = await supabaseClient.from('complaints').select('*').order('created_at', { ascending: false });
    if (!error && data && data.length > 0) {
        const cloudItems = data.map(item => ({
            id: item.id, category: item.category, orderId: item.order_id || "",
            message: item.message, contact: item.contact, customer: item.customer,
            seller: item.seller, status: item.status, priority: item.priority,
            createdAt: item.created_at,
            timeline: [{ actor: "Hệ thống Cloud", text: "Đồng bộ từ Supabase.", at: item.created_at }]
        }));
        complaints = [...cloudItems, ...complaints.filter(c => !cloudItems.some(cl => cl.id === c.id))];
        render();
    }
}
    loadComplaints();render();syncComplaintsFromCloud();
  </script>
  
</body>
