      {name:"Áo thun cotton basic unisex",category:"Thời trang",price:129000,stock:0,icon:"👕",status:"Hết hàng"},
      {name:"Đèn bàn học ánh sáng dịu",category:"Điện tử",price:159000,stock:26,icon:"💡",status:"Đang bán"}
    ];
    const fmt=n=>new Intl.NumberFormat("vi-VN").format(n)+"₫";
    let activePage="overview";
    function notify(message){const t=document.getElementById("toast");t.textContent=message;t.style.display="block";clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.style.display="none",2500)}
    function go(page){activePage=page;document.querySelectorAll(".side-btn").forEach(b=>b.classList.toggle("active",b.dataset.page===page));render()}
    function dashboard(){return `<div class="dashboard-grid"><div class="main-column">

      <section class="card card-pad"><div class="card-title"><h2>Phân tích bán hàng</h2><small>Hôm nay · Dữ liệu cập nhật lúc 09:00</small><button class="link" onclick="go('analytics')">Xem báo cáo ›</button></div><div class="sales-metrics">${[["Doanh số","2.450.000₫"],["Lượt truy cập","1.286"],["Lượt xem sản phẩm","3.840"],["Đơn hàng","18"],["Tỷ lệ chuyển đổi","3,2%"]].map((x,i)=>`<div class="metric"><small>${x[0]} ⓘ</small><strong>${x[1]}</strong><em class="good">${i===0?"↑ 12,8%":"↑ 4,6%"} so với hôm qua</em></div>`).join("")}</div></section>
      <section class="card card-pad"><div class="card-title"><h2>Công cụ tăng trưởng</h2><button class="link" onclick="go('marketing')">Khám phá thêm ›</button></div><div class="service-grid"><article class="service"><h3>🚀 Chương trình tăng tốc doanh số</h3><p>Tham gia chiến dịch để sản phẩm tiếp cận thêm khách hàng trong các ngày hội mua sắm.</p><div class="service-visual">✦ Ngày hội mua sắm · Ưu đãi dành cho shop</div><button class="mini-btn" onclick="go('marketing')">Tìm hiểu</button></article><article class="service blue"><h3>🔎 Quảng bá sản phẩm</h3><p>Chủ động tăng lượt hiển thị và theo dõi hiệu quả chiến dịch ngay tại đây.</p><div class="service-visual">Tối ưu ngân sách quảng cáo của shop</div><button class="mini-btn" onclick="go('boost')">Tạo chiến dịch</button></article></div></section>
      <div class="lower-grid"><section class="card card-pad"><div class="card-title"><h2>Tăng đơn cùng nhà sáng tạo</h2><button class="link" onclick="go('marketing')">Thêm ›</button></div><div class="banner-art">Kết nối sản phẩm của shop với nhà sáng tạo nội dung</div><p style="font-size:11px;color:#738087">Mở rộng tệp khách hàng bằng chương trình tiếp thị liên kết.</p><button class="secondary" onclick="go('marketing')">Khám phá chương trình</button></section><section class="card card-pad"><div class="card-title"><h2>Livestream của shop</h2><button class="link" onclick="go('marketing')">Quản lý ›</button></div><div class="live-banner"><h3>Bắt đầu livestream ngay</h3><p>Giới thiệu sản phẩm, trò chuyện với khách hàng.</p><button class="primary" onclick="notify('Tính năng livestream sẽ sớm mở')">＋ Tạo lịch phát</button></div></section></div>
      </div><aside class="right-column"><section class="card card-pad"><div class="card-title"><h2>Sức khỏe cửa hàng</h2><button class="link" onclick="notify('Shop đang hoạt động ổn định')">Chi tiết ›</button></div><div class="health"><div><b>Tốt</b><small>Không có vi phạm mới</small></div><span style="font-size:27px">🟢</span></div></section>
      <section class="card card-pad"><div class="card-title"><h2>Gợi ý dành cho bạn</h2><small>3 gợi ý</small></div>${recommendation("📦","Bổ sung sản phẩm cho shop","Đăng thêm sản phẩm để khách hàng có nhiều lựa chọn hơn.","Đăng sản phẩm","add-product")}${recommendation("🎨","Làm mới gian hàng","Tạo diện mạo riêng để khách dễ nhận biết shop.","Trang trí","shop")}${recommendation("📈","Thử quảng bá sản phẩm","Tiếp cận thêm khách hàng có nhu cầu.","Bắt đầu","boost")}</section>
      <section class="card card-pad"><div class="card-title"><h2>Tin từ TaChi</h2><button class="link" onclick="notify('Bạn đang xem tin mới nhất')">Xem tất cả ›</button></div><div class="news-item">🗓 Chuẩn bị cho mùa mua sắm cuối năm<small>Cập nhật · 2 giờ trước</small></div><div class="news-item">💡 Mẹo chụp ảnh sản phẩm bằng điện thoại<small>Kiến thức bán hàng · Hôm qua</small></div><div class="news-item">🚚 Cập nhật khung giờ lấy hàng<small>Vận chuyển · 18/11/2026</small></div></section></aside></div>`}
    function recommendation(icon,title,text,label,page){return `<article class="recommendation"><h3>${icon} ${title}</h3><p>${text}</p><div class="row"><span class="hint">Gợi ý cho shop</span><button onclick="go('${page}')">${label}</button></div>${page==="add-product"?'<div class="tiny-progress"><i></i></div>':""}</article>`}
    function productsPage(){return `<div class="page-header"><h1>Sản phẩm của shop</h1><button class="primary" onclick="go('add-product')">＋ Thêm sản phẩm</button></div><section class="card page-box"><div class="toolbar"><input placeholder="Tìm tên sản phẩm..." oninput="filterProducts(this.value)"><select onchange="filterStatus(this.value)"><option value="">Tất cả trạng thái</option><option>Đang bán</option><option>Hết hàng</option></select><button class="secondary" onclick="notify('Đã tải danh sách sản phẩm')">Xuất danh sách</button></div><table class="data-table"><thead><tr><th>Sản phẩm</th><th>Danh mục</th><th>Giá</th><th>Tồn kho</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody id="productRows">${productRows(inventory)}</tbody></table></section>`}
    function productRows(list){return list.map((p,i)=>`<tr><td><span class="product-thumb">${p.icon}</span>${p.name}</td><td>${p.category}</td><td>${fmt(p.price)}</td><td>${p.stock}</td><td><span class="status ${p.status==="Đang bán"?"ok":""}">${p.status}</span></td><td><button class="link" onclick="notify('Đang mở chỉnh sửa sản phẩm')">Sửa</button></td></tr>`).join("")||'<tr><td colspan="6">Không tìm thấy sản phẩm.</td></tr>'}
    function filterProducts(value){const filtered=inventory.filter(p=>p.name.toLowerCase().includes(value.toLowerCase()));document.getElementById("productRows").innerHTML=productRows(filtered)}
    function filterStatus(value){const filtered=inventory.filter(p=>!value||p.status===value);document.getElementById("productRows").innerHTML=productRows(filtered)}
    function addProductPage(){return `<div class="page-header"><h1>Thêm sản phẩm mới</h1><button class="secondary" onclick="go('products')">← Danh sách sản phẩm</button></div><section class="card page-box"><form class="seller-form" onsubmit="publishProduct(event)"><div class="field"><label>Tên sản phẩm *</label><input id="pName" required placeholder="Nhập tên sản phẩm"></div><div class="field-row"><div class="field"><label>Danh mục *</label><select id="pCategory"><option>Thời trang</option><option>Điện tử</option><option>Nhà cửa</option><option>Làm đẹp</option><option>Thực phẩm</option></select></div><div class="field"><label>Giá bán *</label><input id="pPrice" type="number" min="1000" required placeholder="129000"></div></div><div class="field-row"><div class="field"><label>Số lượng tồn kho *</label><input id="pStock" type="number" min="0" required placeholder="100"></div><div class="field"><label>Ảnh đại diện</label><div class="upload"><label>＋ Chọn ảnh sản phẩm <input type="file" accept="image/*" hidden></label></div></div></div><div class="field"><label>Mô tả sản phẩm</label><textarea placeholder="Thông tin chi tiết sản phẩm..."></textarea></div><button class="primary">Đăng sản phẩm</button></form></section>`}
    async function publishProduct(e){
      e.preventDefault();
      const name=document.getElementById("pName").value.trim();
      const price=Number(document.getElementById("pPrice").value);
      const stock=Number(document.getElementById("pStock").value);
      const category=document.getElementById("pCategory").value;
      if(typeof addProductToCloud!=="function"){
        console.error("Không thể đăng sản phẩm: hàm addProductToCloud chưa được tải.");
        notify("Không thể kết nối Cloud để đăng sản phẩm.");
        return;
      }
      const savedData=await addProductToCloud({name,price,category,image_url:"📦",stock,seller_name:"Shop Nhà Mây"});
      if(!savedData||!savedData[0])return;
      const product=savedData[0];
      inventory.unshift({
        id:product.id,
        name:product.name||name,
        category:product.category||category,
        price:Number(product.price)||price,
        stock:Number(product.stock)||0,
        icon:product.image_url&&product.image_url.length<=4?product.image_url:"📦",
        status:Number(product.stock)>0?"Đang bán":"Hết hàng"
      });
      notify("Đã đăng sản phẩm lên Cloud");
      go("products");
    }
    async function initCloudData(){
      if(typeof fetchProductsFromCloud!=="function"){
        console.error("Không thể tải sản phẩm: hàm fetchProductsFromCloud chưa được tải.");
        notify("Không thể kết nối Cloud để tải sản phẩm.");
        return;
      }
      const cloudProducts=await fetchProductsFromCloud();
      if(!cloudProducts||cloudProducts.length===0)return;
      inventory.unshift(...cloudProducts.map(product=>({
        id:product.id,
        name:product.name,
        category:product.category||"Khác",
        price:Number(product.price)||0,
        stock:Number(product.stock)||0,
        icon:product.image_url&&product.image_url.length<=4?product.image_url:"📦",
        status:Number(product.stock)>0?"Đang bán":"Hết hàng"
      })));
      render();
    }
    function ordersPage(){return `<div class="page-header"><h1>Quản lý đơn hàng</h1><button class="secondary" onclick="notify('Đã tải danh sách đơn hàng')">Tải lại</button></div><section class="card page-box"><div class="toolbar"><select><option>Tất cả đơn hàng</option><option>Chờ lấy hàng</option><option>Đang giao</option><option>Hoàn thành</option></select><input placeholder="Tìm mã đơn hàng"></div><table class="data-table"><thead><tr><th>Mã đơn</th><th>Sản phẩm</th><th>Ngày đặt</th><th>Tổng tiền</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody><tr><td>CV-261119-048</td><td>🎧 Tai nghe Bluetooth × 1</td><td>19/11/2026</td><td>189.000₫</td><td><span class="status">Chờ lấy hàng</span></td><td><button class="link" onclick="notify('Đã xác nhận đơn hàng')">Xác nhận</button></td></tr><tr><td>CV-261118-042</td><td>🥤 Bình giữ nhiệt × 2</td><td>18/11/2026</td><td>198.000₫</td><td><span class="status ok">Đang giao</span></td><td><button class="link" onclick="notify('Đang xem chi tiết đơn')">Chi tiết</button></td></tr><tr><td>CV-261117-038</td><td>👕 Áo thun cotton × 1</td><td>17/11/2026</td><td>129.000₫</td><td><span class="status ok">Hoàn thành</span></td><td><button class="link" onclick="notify('Đang xem chi tiết đơn')">Chi tiết</button></td></tr></tbody></table></section>`}
    function shopPage(){return `<div class="page-header"><h1>Trang trí gian hàng</h1><button class="primary" onclick="notify('Đã lưu giao diện gian hàng')">Lưu thay đổi</button></div><section class="card page-box"><div class="shop-cover"><div><h2>☁️ Shop Nhà Mây</h2><p>Đồ dùng xinh xắn cho cuộc sống tiện nghi hơn.</p></div></div><form class="seller-form" onsubmit="event.preventDefault();notify('Đã cập nhật thông tin gian hàng')"><div class="field"><label>Tên gian hàng</label><input value="Shop Nhà Mây"></div><div class="field"><label>Mô tả</label><textarea>Đồ dùng xinh xắn cho cuộc sống tiện nghi hơn mỗi ngày.</textarea></div><div class="field-row"><div class="field"><label>Màu sắc chủ đạo</label><input type="color" value="#137c82"></div><div class="field"><label>Ảnh bìa</label><input type="file" accept="image/*"></div></div><button class="primary">Cập nhật gian hàng</button></form></section>`}
    function boostPage(){return `<div class="page-header"><h1>Đẩy sản phẩm</h1><small>Chọn gói quảng bá phù hợp với mục tiêu của shop</small></div><div class="promo-grid">${[["Khởi động","3 ngày","49.000₫","Tăng hiển thị cơ bản"],["Tăng tốc","7 ngày","99.000₫","Ưu tiên trong danh mục"],["Bứt phá","14 ngày","179.000₫","Hiển thị nổi bật"]].map(x=>`<section class="card page-box"><h2>${x[0]}</h2><p style="color:var(--muted)">${x[1]} · ${x[3]}</p><h2 style="color:var(--teal)">${x[2]}</h2><button class="primary" onclick="notify('Đã chọn gói ${x[0]}')">Chọn gói</button></section>`).join("")}</div><section class="card page-box" style="margin-top:12px"><label>Chọn sản phẩm muốn quảng bá</label><select class="form-control" style="display:block;margin:8px 0;width:min(450px,100%)">${inventory.map(p=>`<option>${p.name}</option>`).join("")}</select><button class="primary" onclick="notify('Chiến dịch quảng bá đã được tạo')">Tạo chiến dịch</button></section>`}
    function marketingPage(){return `<div class="page-header"><h1>Kênh Marketing</h1><button class="primary" onclick="notify('Đã đăng ký nhận thông tin chương trình')">Khám phá chiến dịch</button></div><div class="promo-grid"><section class="card page-box"><h2>🎉 Chương trình khuyến mãi</h2><p>Tạo mã giảm giá và ưu đãi riêng cho khách hàng của shop.</p><button class="secondary" onclick="notify('Đã mở thiết lập khuyến mãi')">Tạo khuyến mãi</button></section><section class="card page-box"><h2>🤝 Tiếp thị liên kết</h2><p>Mời nhà sáng tạo nội dung giới thiệu sản phẩm của bạn.</p><button class="secondary" onclick="notify('Đã mở chương trình tiếp thị')">Tìm nhà sáng tạo</button></section><section class="card page-box"><h2>📺 Livestream</h2><p>Lên lịch buổi phát trực tiếp để kết nối với người mua.</p><button class="secondary" onclick="notify('Tính năng livestream sẽ sớm mở')">Tạo lịch phát</button></section></div>`}
    function analyticsPage(){return `<div class="page-header"><h1>Phân tích bán hàng</h1><select class="form-control"><option>7 ngày gần nhất</option><option>30 ngày gần nhất</option></select></div><section class="card page-box"><div class="sales-metrics">${[["Doanh số","15.820.000₫"],["Lượt truy cập","8.406"],["Lượt xem sản phẩm","24.120"],["Đơn hàng","126"],["Tỷ lệ chuyển đổi","3,8%"]].map(x=>`<div class="metric"><small>${x[0]}</small><strong>${x[1]}</strong><em class="good">↑ 8,4% so với kỳ trước</em></div>`).join("")}</div><div style="height:220px;margin:22px 4px 12px;display:flex;align-items:end;justify-content:space-around;background:repeating-linear-gradient(to bottom,#fff 0,#fff 49px,#edf1f2 50px)">${[40,66,50,78,59,93,71].map((h,i)=>`<div style="height:${h}%;width:7%;background:linear-gradient(#6bc4b2,#177c83);border-radius:5px 5px 0 0;position:relative"><small style="position:absolute;bottom:-20px;left:30%;color:#879398">${["T2","T3","T4","T5","T6","T7","CN"][i]}</small></div>`).join("")}</div></section>`}
    const chats=[
      {id:"sxmb39",name:"sxmb39",date:"27/06",preview:"Xem kết quả",tag:"Đã bị khóa",avatar:"SX",type:"green"},
      {id:"sxmb39-2",name:"sxmb39",date:"27/06",preview:"Xem kết quả",tag:"Đã bị khóa",avatar:"SX",type:"green"},
      {id:"yunanun",name:"YUNANUN Mall",date:"28/06/25",preview:"[Sản phẩm] Bọt biển tẩy tế bào...",tag:"",avatar:"YU",type:"mall"},
      {id:"linhkien",name:"linhkienlaptop.",date:"16/06/25",preview:"[Hình ảnh]",tag:"",avatar:"L",type:""}
    ];
    let selectedChat=null;
    function chatPage(){
      return `<section class="chat-shell">
        <aside class="chat-sidebar"><div class="chat-main-header" style="height:54px"><h1 style="color:#ed5050">Chat</h1></div><div class="chat-toolbar"><div class="chat-search"><span>⌕</span><input id="chatSearch" placeholder="Tìm theo tên" oninput="filterChats(this.value)"></div><select onchange="filterChatStatus(this.value)"><option value="">Tất cả</option><option value="tag">Đã bị khóa</option></select></div><div class="chat-conversations" id="chatConversations">${chatRows(chats)}</div></aside>
        <main class="chat-main"><div class="chat-main-header"><h1 style="visibility:hidden">Chat</h1><div class="chat-header-actions"><button title="Cửa sổ chat" onclick="notify('Đang mở cửa sổ chat')">□</button><button title="Đóng" onclick="selectChat(null)">⌄</button></div></div><div id="chatContent">${selectedChat?chatConversation():chatEmpty()}</div></main>
      </section>`;
    }
    function chatRows(list){return list.map(chat=>`<article class="chat-item ${selectedChat===chat.id?"active":""}" onclick="selectChat('${chat.id}')"><div class="chat-avatar ${chat.type}">${chat.avatar}</div><div><div class="chat-item-head"><span class="chat-name">${chat.name}</span><span class="chat-date">${chat.date}</span></div><div class="chat-item-body"><span class="chat-preview">${chat.preview}</span>${chat.tag?`<span class="chat-tag">${chat.tag}</span>`:""}</div></div></article>`).join("")||'<div style="padding:20px;text-align:center;color:var(--muted)">Không tìm thấy hội thoại</div>'}
    function filterChats(value){const query=value.toLowerCase();const filtered=chats.filter(chat=>chat.name.toLowerCase().includes(query)||chat.preview.toLowerCase().includes(query));document.getElementById("chatConversations").innerHTML=chatRows(filtered)}
    function filterChatStatus(value){const filtered=value?chats.filter(chat=>chat.tag):chats;document.getElementById("chatConversations").innerHTML=chatRows(filtered)}
    function chatEmpty(){return `<div class="chat-empty"><div class="chat-empty-inner"><div class="chat-illustration"><div class="laptop-screen"></div><div class="laptop-base"></div><div class="chat-bubble-art"></div></div><h2>Chào mừng bạn đến với Shop Chat</h2><p>Trò chuyện với người bán ngay!</p></div></div>`}
    function selectChat(id){selectedChat=id;const content=document.getElementById("chatContent");const rows=document.getElementById("chatConversations");if(content)content.innerHTML=id?chatConversation():chatEmpty();if(rows)rows.innerHTML=chatRows(chats);if(id){setTimeout(()=>{const input=document.getElementById("chatReply");if(input)input.focus()},0)}}
    function chatConversation(){const chat=chats.find(item=>item.id===selectedChat)||chats[0];return `<div class="chat-conversation"><div class="chat-conversation-head"><div class="chat-avatar ${chat.type}">${chat.avatar}</div><div><strong>${chat.name}</strong><small>Đang hoạt động</small></div></div><div class="chat-message-list" id="chatMessageList"><div class="message-row"><div class="message-bubble">Xin chào, tôi cần tư vấn về sản phẩm này.<span class="message-time">09:30</span></div></div><div class="message-row mine"><div class="message-bubble">Chào bạn! Shop Nhà Mây có thể hỗ trợ bạn.<span class="message-time">09:31</span></div></div></div><div class="chat-composer"><button title="Đính kèm">⌕</button><button title="Thêm">＋</button><input id="chatReply" placeholder="Nhập tin nhắn..." onkeydown="if(event.key==='Enter')sendChatReply()"><button class="send-chat" onclick="sendChatReply()">Gửi</button></div></div>`}
    function sendChatReply(){const input=document.getElementById("chatReply");if(!input)return;const text=input.value.trim();if(!text)return;const area=document.getElementById("chatMessageList");const bubble=document.createElement("div");bubble.className="message-row mine";bubble.innerHTML='<div class="message-bubble"></div>';bubble.querySelector(".message-bubble").textContent=text;const time=document.createElement("span");time.className="message-time";time.textContent="Vừa xong";bubble.querySelector(".message-bubble").appendChild(time);area.appendChild(bubble);input.value="";area.scrollTop=area.scrollHeight}
    function render(){const page=document.getElementById("page");const workspace=document.querySelector(".workspace");workspace.classList.toggle("chat-mode",activePage==="chat");if(activePage==="overview")page.innerHTML=dashboard();else if(activePage==="products")page.innerHTML=productsPage();else if(activePage==="add-product")page.innerHTML=addProductPage();else if(activePage==="orders")page.innerHTML=ordersPage();else if(activePage==="shop")page.innerHTML=shopPage();else if(activePage==="boost")page.innerHTML=boostPage();else if(activePage==="marketing")page.innerHTML=marketingPage();else if(activePage==="analytics")page.innerHTML=analyticsPage();else if(activePage==="chat")page.innerHTML=chatPage()}
    document.querySelectorAll(".side-btn").forEach(b=>b.addEventListener("click",()=>go(b.dataset.page)));
    render();
    initCloudData();
  </script>
 
</body>
</html>
